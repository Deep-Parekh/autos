# Local pilot configuration template.
#   cp config/pilot.template.yaml config/config.yaml   (config/config.yaml is git-ignored)
# Replace every REPLACE_ME value, then validate:
#   node --conditions=development --import tsx scripts/validate-config.ts config/config.yaml
# This file holds NO secrets. *_env fields name environment variables; set their values in .env (see .env.example).
schema_version: 1

jira:
  site_url: https://REPLACE_ME.atlassian.net        # Cloud site root only: https, no path
  saved_filter_id: 'REPLACE_ME'                       # numeric ID from the filter URL (...?filter=12345)
  allowed_projects: [REPLACE_ME]                      # e.g. [WTS]; must match Confluence branch-map rows
  # intake_types: [Bug]                              # optional: only these issue types; omit to accept every issue in the filter
  acceptance_criteria_fields: []                      # e.g. [customfield_10050] if criteria live in a custom field
  read_only: true
  poll_seconds: 60                                    # lower for local testing; 300 for steady state
  # Start with false: the controller then only runs tickets you submit (autos run KEY). Set true after a
  # supervised dry run and one real ticket to let it work through the filter on its own.
  auto_poll: false
  max_new_per_poll: 5                                 # new tickets admitted per poll
  username_env: AUTOS_ATLASSIAN_EMAIL
  token_env: AUTOS_ATLASSIAN_TOKEN

confluence:
  site_url: https://REPLACE_ME.atlassian.net
  branch_map_page_id: 'REPLACE_ME'                    # page built from Confluence_Project_Branch_Mapping_Template.md
  read_only: true
  username_env: AUTOS_ATLASSIAN_EMAIL
  token_env: AUTOS_ATLASSIAN_TOKEN

bitbucket:
  allowed_repositories:
    - workspace: REPLACE_ME                           # Bitbucket workspace slug
      repository_slug: REPLACE_ME
      # Exactly https://bitbucket.org/<workspace>/<slug>.git or git@bitbucket.org:<workspace>/<slug>.git
      # (no credentials in the URL). Use the git@ form with ssh-agent for the simplest local setup.
      remote_url: git@bitbucket.org:REPLACE_ME/REPLACE_ME.git
      protected_branches: [main, develop]
      build_profile: pilot-java
      allowed_paths: [src/**, pom.xml]                # paths the SWE role may change
      prohibited_paths: [src/main/resources/secrets/**]
  push_feature_branch: false                          # keep false until a local READY_FOR_HUMAN has been reviewed
  push_blocked_attempts: false                        # push a blocked attempt's unreviewed work to the feature branch; retries continue from it
  create_pull_request: false
  # read_token_env: AUTOS_BITBUCKET_READ_TOKEN        # optional: enables similar-fix (precedent) lookup

git:
  branch_template: deep/{issueKey}
  no_rebase: true
  no_force_push: true
  refuse_existing_feature_branch: true

providers:
  claude: {binary: claude, auth_profile: pilot}       # auth_profile = top-level key in provider-profiles.json
  codex: {binary: codex, auth_profile: pilot}
  cursor: {binary: cursor-agent, auth_profile: pilot} # Cursor CLI (installed as agent/cursor-agent); model is always "auto"

# Optional cost control (opt-in): model tiers (size classes) and per-role ladders, cheapest tier first. To use it,
# uncomment models/model_tiers (and triage) and replace a role's provider/model/fallbacks with `ladder:` (docs/local-pilot.md
# "Model tiers"). A tier is an ordered list of 1-3 entries {provider, model, effort}; entries are tried in order when one
# fails on the provider side (limit, outage, auth, timeout, context/output), keeping the SWE handoff. A failed check/QA/review
# (or a tier whose last entry hit CONTEXT/INVALID_OUTPUT) moves the role to its next tier. Effort per entry: claude
# low|medium|high|xhigh|max; codex none|minimal|low|medium|high|xhigh|max; omit for the CLI default; cursor: model auto, no
# effort. `models` names reusable models so entries can be written `luna:high`. `min` is a floor nothing goes below.
# Pin a ticket's start tier with `autos tier KEY med [--effort xhigh]` (works before Autos has seen the ticket).
# models:
#   luna:  {provider: codex, model: gpt-6-luna}
#   terra: {provider: codex, model: gpt-6-terra}
# model_tiers:
#   sm:  [{provider: claude, model: haiku, effort: high}, luna:high]
#   med: [terra:high, {provider: claude, model: sonnet, effort: high}, {provider: cursor, model: auto}]
#   lg:  [{provider: codex, model: gpt-6-sol, effort: xhigh}, {provider: claude, model: opus, effort: max}]
# triage: {enabled: true, tier: sm, timeout_ms: 180000}   # one read-only call per new ticket picks start tiers
# agents:
#   swe:      {timeout_ms: 1800000, ladder: [sm, med, lg]}
#   qa:       {timeout_ms: 900000,  ladder: [med, lg]}
#   reviewer: {timeout_ms: 900000,  ladder: [med, lg], min: med}
agents:
  # Fallbacks run in order after AUTH/RATE_LIMIT/UPSTREAM/UNAVAILABLE/TIMEOUT/INVALID_OUTPUT/CONTEXT failures.
  # Each role tries all three subscriptions before blocking; profiles decide subscription vs API billing.
  # Models: add `model:` to a role (its primary provider) and/or to any fallback entry. Autos passes it as --model.
  # Omit it to use the CLI's default for your plan. Claude accepts aliases (opus, sonnet, haiku) or full ids
  # (e.g. claude-opus-5-5); Codex accepts the names its `/model` picker shows for your ChatGPT plan; Cursor is always auto.
  # Names are only checked for format here; `providers test` or the first call reveals an unavailable model. Example:
  #   swe:      {provider: claude, model: opus,   timeout_ms: 1800000, fallbacks: [{provider: codex, model: <codex-model>}, {provider: cursor}]}
  #   qa:       {provider: codex,  model: <codex-model>, timeout_ms: 900000, fallbacks: [{provider: claude, model: sonnet}]}
  #   reviewer: {provider: claude, model: opus,   timeout_ms: 900000,  fallbacks: [{provider: codex, model: <codex-model>}]}
  swe: {provider: claude, timeout_ms: 1800000, fallbacks: [{provider: codex}, {provider: cursor}]}
  qa: {provider: codex, timeout_ms: 900000, fallbacks: [{provider: claude}, {provider: cursor}]}
  reviewer: {provider: claude, timeout_ms: 900000, fallbacks: [{provider: codex}, {provider: cursor}]}    # fresh session, independent of SWE

jobs:
  # Concurrent tickets (slots). Keep 1 for the pilot; on a larger host raise up to 8 (at most one active job per issue).
  max_parallel: 1
  # Concurrent build/test runs across all tickets; must be <= max_parallel. Builds are the heaviest step.
  max_concurrent_checks: 1
  max_repair_rounds: 2
  # Disk hygiene: workspaces of BLOCKED/CANCELLED/superseded attempts are removed after this many hours.
  # The latest READY_FOR_HUMAN workspace stays until you run `autos close <KEY> --merged|--abandoned`.
  workspace_retention_hours: 72
  auto_prune_workspaces: true
  similar_tickets: {enabled: true, max_candidates: 5}
  # When every provider of a role is rate limited the attempt pauses (no slot) and resumes in the same workspace at the
  # provider-reported reset, else after initial_minutes doubling per pause up to max_minutes; BLOCKED after max_total_hours.
  rate_limit_pause: {initial_minutes: 15, max_minutes: 240, max_total_hours: 24}

build_profiles:
  pilot-java:
    # jdk: '21'        # optional fallback when the branch map's JDK column is blank (the branch map wins)
    # tomcat: 11.0.24  # optional fallback for the branch map's Tomcat column
    checks:
      # Checks run in autos-checks:local with NO network: Maven must run offline against the
      # preloaded cache mounted from AUTOS_MAVEN_CACHE_ROOT.
      - executable: mvn
        # Offline against the preloaded cache; the tracking flag lets Maven use artifacts cached through your mirror/Archiva ids.
        # Add repository-specific flags here, e.g. -Dmaven.gitcommitid.skip=true (checks build a copy without .git).
        args: [-o, --batch-mode, -Dmaven.repo.local=/opt/autos/m2/repository, -Daether.enhancedLocalRepository.trackingFilename=.autos-untracked, test]
        timeout_ms: 1200000
        required: true

security:
  allow_jira_write: false
  allow_confluence_write: false
  allow_merge: false
  allow_deploy: false
  allow_prod_db: false

storage:
  data_dir: data
  artifacts_dir: artifacts
  workspaces_dir: workspaces

api:
  listen_host: 127.0.0.1
  port: 8787
  operator_token_env: AUTOS_OPERATOR_TOKEN

# Optional Teams notifications (`autos teams relay`, docs/teams.md). The webhook URL is a secret: put it in .env.
# notifications:
#   teams:
#     webhook_url_env: AUTOS_TEAMS_WEBHOOK_URL
#     notify: [READY_FOR_HUMAN, BLOCKED, PAUSED, AUTOS_UP, AUTOS_DOWN]   # also: CANCELLED, PLANNED, TIER_ESCALATED, PROVIDER_GATE
#     include_commands: true                       # copyable `autos ...` next steps on each card
#     auth:                                        # only if the workflow requires sign-in (docs/teams.md)
#       tenant_id: 00000000-0000-0000-0000-000000000000
#       client_id: 00000000-0000-0000-0000-000000000000
#       client_secret_env: AUTOS_TEAMS_CLIENT_SECRET

# Optional read-only Jira/Confluence tools for agents (docs/knowledge.md). Off by default; nothing can be written.
# Add `knowledge:` only after reading that guide: content agents read is sent to their model provider.
# knowledge:
#   enabled: false                 # true turns it on (rebuild the worker images, restart supervisor and controller)
#   roles: [swe, qa, reviewer]     # roles that get the tools
#   gateway:
#     listen_host: 127.0.0.1       # Linux: the Docker bridge gateway address instead (docs/knowledge.md)
#     port: 8791
#     advertise_url: http://host.docker.internal:8791
#   jira:
#     projects: [SAMPLE]           # optional; default is jira.allowed_projects
#   confluence:
#     spaces: [DOCS, KB]           # space keys from /wiki/spaces/KEY/ (personal spaces start with ~)
#     pages: []                    # page IDs: each page and all its descendants are readable
#   limits:
#     max_calls_per_run: 80
#     max_result_chars: 40000
#     max_total_chars_per_run: 600000
#     max_attachment_bytes: 5242880
#     search_results: 10
