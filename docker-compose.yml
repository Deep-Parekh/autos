services:
  controller:
    build:
      context: .
      dockerfile: docker/controller/Dockerfile
    command: ["node", "apps/cli/bin/autos.mjs", "--config", "/app/config/config.yaml", "controller", "start"]
    user: "${AUTOS_CONTROLLER_UID:-1000}:${AUTOS_CONTROLLER_GID:-1000}"
    # Controller-only secrets (Atlassian, operator token). Provider keys live with the supervisor, never here.
    env_file: ${AUTOS_CONTROLLER_ENV_FILE:-.env}
    environment:
      AUTOS_CONTAINER_BIND_HOST: "0.0.0.0"
      # Trusted Git credentials: askpass helper + token file mounted read-only below (see deploy/git/).
      AUTOS_GIT_ASKPASS_PATH: /run/autos-git/askpass.sh
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      # Mount the directory, not the file: editors replace the file's inode, which a single-file bind mount would not see.
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./workspaces:/app/workspaces
      - ${AUTOS_GIT_SECRETS_DIR:-/etc/autos/git}:/run/autos-git:ro
    restart: unless-stopped
    # Let an active job abort and record CANCELLED evidence before the container is killed.
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
