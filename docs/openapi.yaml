  /v1/jobs/{jobId}/revisions:
    post:
      operationId: createJobRevision
      summary: Request changes on a READY_FOR_HUMAN job
      tags:
        - operator
      description: "Queues a revision that continues from the reviewed commit on the same feature branch, with operator notes delivered to the selected roles (default SWE). Only the latest READY_FOR_HUMAN attempt of an issue with no active attempt can be revised (409 otherwise). The optional `X-Autos-Operator` header labels the note author; it is a label, not authentication. Notes are stored as evidence and never appear in responses, events, or logs. Optional `tier` (with an optional `effort` override for its entries) sets the SWE starting tier for this revision only: it wins over the ticket pin and over the step that finished the previous attempt, but never goes below the role's ladder floor (`min`); 400 with the reason for an unknown tier, an effort a Claude/Codex entry of the tier does not accept, or a tier below the floor."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                instructions:
                  type: string
                  minLength: 1
                  maxLength: 4000
                  description: Operator guidance for the selected roles. Cannot relax path policy or other platform rules.
                roles:
                  type: array
                  minItems: 1
                  maxItems: 3
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - swe
                      - qa
                      - reviewer
                  description: Roles that receive the note; defaults to ["swe"].
                tier:
                  type: string
                  pattern: ^[a-z0-9][a-z0-9_-]{0,39}$
                  description: Optional SWE starting tier (a `model_tiers` name) for this revision only (wins over the ticket pin and the previous attempt's finishing step; never below the role's floor).
                effort:
                  type: string
                  enum:
                    - none
                    - minimal
                    - low
                    - medium
                    - high
                    - xhigh
                    - max
                  description: Optional effort override for the entries of `tier`; only valid together with `tier` (400 otherwise).
              required:
                - instructions
            example:
              instructions: Also handle the empty-list case.
              roles:
                - swe
              tier: med
              effort: xhigh
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: jobId
          required: true
        - schema:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.@-]{0,63}$
          in: header
          name: x-autos-operator
          required: false
          description: Optional author label (not authentication). Defaults to operator.
      security:
        - bearerAuth: []
      responses:
        "202":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  job_id:
                    type: string
                    format: uuid
                  issue_key:
                    type: string
                    pattern: ^[A-Z][A-Z0-9]*-[1-9][0-9]*$
                  repository_id:
                    type:
                      - string
                      - "null"
                  base_sha:
                    type:
                      - string
                      - "null"
                  base_branch:
                    type: string
                  state:
                    type: string
                    enum:
                      - QUEUED
                      - INVESTIGATING
                      - PLANNED
                      - IMPLEMENTING
                      - QA
                      - REVIEW
                      - REVISING
                      - PAUSED
                      - READY_FOR_HUMAN
                      - BLOCKED
                      - CANCELLING
                      - CANCELLED
                  dry_run:
                    type: boolean
                  repair_round:
                    type: integer
                    minimum: 0
                    maximum: 2
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
                  blocked_code:
                    type: string
                    enum:
                      - INVALID_CONFIG
                      - INVALID_INPUT
                      - AUTH
                      - FORBIDDEN
                      - NOT_FOUND
                      - RATE_LIMIT
                      - UPSTREAM
                      - MAPPING
                      - BRANCH_COLLISION
                      - POLICY
                      - TIMEOUT
                      - CANCELLED
                      - CONTEXT
                      - TOOL
                      - INVALID_OUTPUT
                      - STALE_CANDIDATE
                      - CHECK_FAILED
                      - CONFLICT
                      - INTERNAL
                      - UNAVAILABLE
                  blocked_reason:
                    type: string
                  feature_branch:
                    type: string
                  commit_sha:
                    type: string
                  push_status:
                    type: string
                    enum:
                      - DISABLED
                      - NOT_ATTEMPTED
                      - PUSHED
                      - FAILED
                  parent_job_id:
                    type: string
                    format: uuid
                    description: "Set on revision jobs: the READY_FOR_HUMAN job whose commit this attempt continues."
                  revision:
                    type: integer
                    minimum: 0
                    maximum: 20
                    description: 0 for an initial attempt, n for the n-th requested revision of the same issue.
                  closed_as:
                    type: string
                    enum:
                      - MERGED
                      - ABANDONED
                    description: Set on every attempt of an issue the operator closed (MERGED or ABANDONED).
                  wip_commit_sha:
                    type: string
                    description: "BLOCKED only: commit on the feature branch that preserves the attempt's unreviewed work. Not reviewed and not ready to merge; an explicit retry continues from it."
                  wip_push_status:
                    type: string
                    enum:
                      - PUSHED
                      - FAILED
                      - DISABLED
                    description: "BLOCKED only: whether that commit was pushed (bitbucket.push_blocked_attempts)."
                  continues_job_id:
