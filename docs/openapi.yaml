                retried: 1
                skipped_newer_attempt: 1
                failed: 0
                jobs:
                  - issue_key: SAMPLE-123
                    job_id: 00000000-0000-4000-8000-000000000001
                    new_job_id: 00000000-0000-4000-8000-000000000002
