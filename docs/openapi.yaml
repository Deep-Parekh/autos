  /v1/workspaces/prune:
    post:
      operationId: pruneWorkspaces
      summary: Prune removable workspaces now
      tags:
        - operator
      description: "Applies the retention policy immediately: removes workspaces of closed issues, superseded attempts, orphan directories, and BLOCKED/CANCELLED attempts older than the retention window (`older_than_hours` overrides `jobs.workspace_retention_hours` for this run). The latest READY_FOR_HUMAN workspace of an open issue is never removed. Artifacts are never removed. Use `dry_run` to preview."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                dry_run:
                  type: boolean
                  default: false
                older_than_hours:
                  type: integer
                  minimum: 0
                  maximum: 2160
                  description: Overrides jobs.workspace_retention_hours for this run (closed issues are always removable).
                sizes:
                  type: boolean
                  default: false
            example:
              dry_run: true
              older_than_hours: 24
      parameters:
        - schema:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.@-]{0,63}$
          in: header
          name: x-autos-operator
          required: false
          description: Optional audit label (not authentication). Defaults to operator.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  dry_run:
                    type: boolean
                  removed:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      description: One workspace directory (basename only, never a path) with its retention decision.
                      properties:
                        name:
                          type: string
                          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                        job_id:
                          type: string
                          format: uuid
                        issue_key:
                          type:
                            - string
                            - "null"
                          description: Null for an orphan directory with no matching job.
                        state:
                          type:
                            - string
                            - "null"
                          enum:
                            - QUEUED
                            - INVESTIGATING
                            - PLANNED
                            - IMPLEMENTING
                            - QA
                            - REVIEW
                            - REVISING
                            - READY_FOR_HUMAN
                            - BLOCKED
                            - CANCELLING
                            - CANCELLED
                            - null
                        closed_as:
                          type:
                            - string
                            - "null"
                          enum:
                            - MERGED
                            - ABANDONED
                            - null
                        modified_at:
                          type: string
                          format: date-time
                        size_bytes:
                          type:
                            - integer
                            - "null"
                          minimum: 0
                          description: Only when sizes were requested, else null.
                        removable:
                          type:
                            - string
                            - "null"
                          enum:
                            - closed
                            - superseded
                            - retention
                            - orphan
                            - null
                          description: Why the workspace is removable now; null when retained.
                        retained_because:
                          type:
                            - string
                            - "null"
                          enum:
                            - active
                            - awaiting_review
                            - within_retention
                            - null
                      required:
                        - name
                        - job_id
                        - issue_key
                        - state
                        - closed_as
                        - modified_at
                        - size_bytes
                        - removable
                        - retained_because
                  failed:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        name:
                          type: string
                          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                        job_id:
                          type: string
                          format: uuid
                        code:
                          type: string
                          enum:
                            - INVALID_CONFIG
                            - INVALID_INPUT
                            - AUTH
                            - FORBIDDEN
                            - NOT_FOUND
                            - RATE_LIMIT
                            - UPSTREAM
                            - MAPPING
                            - BRANCH_COLLISION
                            - POLICY
                            - TIMEOUT
                            - CANCELLED
                            - CONTEXT
                            - TOOL
                            - INVALID_OUTPUT
                            - STALE_CANDIDATE
                            - CHECK_FAILED
                            - CONFLICT
                            - INTERNAL
                            - UNAVAILABLE
                      required:
                        - name
                        - job_id
                        - code
                  freed_bytes:
                    type:
                      - integer
                      - "null"
                    minimum: 0
                    description: Sum of removed sizes when sizes were requested, else null.
                  remaining:
                    type: integer
                    minimum: 0
                required:
                  - dry_run
                  - removed
                  - failed
                  - freed_bytes
                  - remaining
              example:
                dry_run: true
                removed: []
                failed: []
                freed_bytes: null
                remaining: 0
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  request_id:
                    type: string
                    format: uuid
                required:
                  - code
