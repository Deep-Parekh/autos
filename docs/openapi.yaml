                  pause_count:
                    type: integer
                    minimum: 1
                    maximum: 1000
                    description: "PAUSED only: pauses in the current streak."
                required:
                  - job_id
                  - issue_key
                  - repository_id
                  - base_sha
                  - state
                  - dry_run
                  - repair_round
                  - created_at
                  - updated_at
              example:
                job_id: 00000000-0000-4000-8000-000000000001
                issue_key: SAMPLE-123
                repository_id: null
                base_sha: null
                state: PLANNED
                dry_run: true
                repair_round: 0
                created_at: 2026-11-07T12:00:00.000Z
