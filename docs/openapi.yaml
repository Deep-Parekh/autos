    put:
      operationId: setTierPin
      summary: Pin a role's starting model tier for an issue
      tags:
        - operator
      description: "A tier pin chooses a role's starting tier (a `model_tiers` name, optionally with an effort override) for an issue key. It can be stored before or after Autos has seen the issue, survives restarts and applies whenever a later attempt is picked up, until cleared. Precedence: a revision's own `tier` > this pin > the step that finished the previous attempt (revisions and retries) > triage > the first ladder tier; never below the role's floor (`min`). `effort` overrides the effort of every entry of the tier whose provider accepts one (Cursor entries run without one) and must be valid for each Claude/Codex entry. A tier in the role's ladder starts at its position (with an effort override it replaces that ladder step in place) and escalation continues to the next tier. A tier not in the ladder is a fixed step with no escalation, refused for a role with a floor; roles without a ladder can be pinned to any tier (fixed step). Replaces the role's previous pin. 400 with the reason for an unknown tier, an effort a Claude/Codex entry of the tier does not accept, a tier below the role's floor or outside the ladder of a role with a floor, or a project outside jira.allowed_projects; 409 when the issue is closed. The optional `X-Autos-Operator` header labels the author; it is a label, not authentication."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                role:
                  type: string
                  enum:
                    - swe
                    - qa
                    - reviewer
                  default: swe
                  description: Role whose starting step is pinned; defaults to swe.
                tier:
                  type: string
                  pattern: ^[a-z0-9][a-z0-9_-]{0,39}$
                  description: A tier name from model_tiers.
                effort:
                  type: string
                  enum:
                    - none
                    - minimal
                    - low
                    - medium
                    - high
                    - xhigh
                    - max
                  description: "Optional effort override applied to every entry of the tier whose provider accepts efforts (Cursor entries run without one); must be valid for each Claude/Codex entry. Omitted: each entry keeps its configured effort."
              required:
                - tier
            example:
              role: swe
              tier: med
              effort: xhigh
      parameters:
        - schema:
            type: string
            pattern: ^[A-Z][A-Z0-9]*-[1-9][0-9]*$
          in: path
          name: issueKey
          required: true
        - schema:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.@-]{0,63}$
          in: header
          name: x-autos-operator
          required: false
          description: Optional audit label (not authentication). Defaults to operator.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  pin:
                    type: object
                    additionalProperties: false
                    description: "An operator model-tier pin: the starting tier of one role for every later attempt of the issue, until cleared."
                    properties:
                      issue_key:
                        type: string
                        pattern: ^[A-Z][A-Z0-9]*-[1-9][0-9]*$
                      role:
                        type: string
                        enum:
                          - swe
                          - qa
                          - reviewer
                      tier:
                        type: string
                        pattern: ^[a-z0-9][a-z0-9_-]{0,39}$
                        description: A tier name from model_tiers.
                      effort:
                        type:
                          - string
                          - "null"
                        enum:
                          - none
                          - minimal
                          - low
                          - medium
                          - high
                          - xhigh
                          - max
                          - null
                        description: "Effort override for every entry of the tier whose provider accepts one; null: each entry keeps its configured effort."
                      author:
                        type: string
                        pattern: ^[A-Za-z0-9][A-Za-z0-9_.@-]{0,63}$
                      created_at:
                        type: string
                        format: date-time
                    required:
                      - issue_key
                      - role
                      - tier
                      - effort
                      - author
                      - created_at
                    examples:
                      - issue_key: SAMPLE-123
                        role: swe
                        tier: med
                        effort: xhigh
                        author: operator
                        created_at: 2026-11-07T12:00:00.000Z
                  step:
                    type: string
                    maxLength: 60
                    description: "The starting step: `tier`, or `tier:effort` with an effort override."
                  in_ladder:
                    type: boolean
                    description: True when the tier is in the role's ladder (the role starts at its position and escalation continues to the next tier); false for a fixed step with no escalation (a tier outside the ladder, or a role without a ladder).
                required:
                  - pin
                  - step
                  - in_ladder
              example:
                pin:
                  issue_key: SAMPLE-123
                  role: swe
                  tier: med
                  effort: xhigh
                  author: operator
                  created_at: 2026-11-07T12:00:00.000Z
                step: med:xhigh
                in_ladder: true
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  request_id:
                    type: string
                    format: uuid
                required:
