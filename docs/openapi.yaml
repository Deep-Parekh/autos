  /v1/precedents/search:
    post:
      operationId: searchPrecedents
      summary: Search precedents for an issue or free text
      tags:
        - operator
      description: "Runs the retrieval pipeline (candidates, evidence gate, optional judge) for an indexed issue (`issue_key`) or free text (`text`; exactly one). `judge: false` skips the provider judge; `explain` adds per-candidate records. The request text is never logged. 409 when precedents.enabled is false. 404 (`NOT_FOUND`) when the precedent index is not configured."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                issue_key:
                  type: string
                  pattern: ^[A-Z][A-Z0-9]*-[1-9][0-9]*$
                text:
                  type: string
                  minLength: 3
                  maxLength: 4000
                limit:
                  type: integer
                  minimum: 1
                  maximum: 20
                include_unresolved:
                  type: boolean
                  default: false
                judge:
                  type: boolean
                  default: true
                explain:
                  type: boolean
                  default: false
            example:
              issue_key: SAMPLE-123
              limit: 5
              judge: false
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  result:
                    type: object
                    additionalProperties: false
                    properties:
                      schema_version:
                        type: integer
                        enum:
                          - 1
                      outcome:
                        type: string
