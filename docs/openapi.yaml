  /v1/notes:
    get:
      operationId: listTicketNotes
      summary: List issues with ticket notes or a hold
      tags:
        - operator
      description: Every issue that has ticket notes or is held, with whether Autos has worked on it (status, attempts, latest state, whether the latest attempts used the current notes).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  tickets:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      description: An issue with ticket notes or a hold, and whether Autos has worked on it.
                      properties:
                        issue_key:
                          type: string
                          pattern: ^[A-Z][A-Z0-9]*-[1-9][0-9]*$
                        notes:
                          type: array
                          maxItems: 5
                          items:
                            type: object
                            additionalProperties: false
                            description: Operator guidance stored for an issue key; applied to every attempt of the issue until removed. The text is evidence only and never appears in events or logs.
                            properties:
                              note_id:
                                type: string
                                format: uuid
                              issue_key:
                                type: string
                                pattern: ^[A-Z][A-Z0-9]*-[1-9][0-9]*$
                              instructions:
                                type: string
                                minLength: 1
                                maxLength: 4000
                              roles:
                                type: array
                                minItems: 1
                                maxItems: 3
                                items:
                                  type: string
                                  enum:
                                    - swe
                                    - qa
                                    - reviewer
                              author:
                                type: string
                                pattern: ^[A-Za-z0-9][A-Za-z0-9_.@-]{0,63}$
                              created_at:
                                type: string
                                format: date-time
                            required:
                              - note_id
                              - issue_key
                              - instructions
                              - roles
                              - author
                              - created_at
                            examples:
                              - note_id: 00000000-0000-4000-8000-000000000010
                                issue_key: SAMPLE-123
                                instructions: Change only InvoiceService.java.
                                roles:
                                  - swe
                                author: operator
                                created_at: 2026-11-07T12:00:00.000Z
                        held:
                          type: boolean
                          description: Automatic discovery does not queue a held issue (explicit runs still work).
                        status:
                          type: string
                          enum:
                            - not_seen
                            - held
                            - queued
                            - in_progress
                            - planned
                            - awaiting_review
                            - blocked
                            - cancelled
                            - closed_merged
                            - closed_abandoned
                          description: "not_seen: no attempt yet (held when also on hold); otherwise derived from the latest non-dry-run attempt."
                        attempts:
                          type: integer
                          minimum: 0
                        dry_runs:
                          type: integer
                          minimum: 0
                        latest_job_id:
                          type:
                            - string
                            - "null"
                          format: uuid
                        latest_state:
                          type:
                            - string
                            - "null"
                          enum:
                            - QUEUED
                            - INVESTIGATING
                            - PLANNED
                            - IMPLEMENTING
                            - QA
                            - REVIEW
                            - REVISING
                            - READY_FOR_HUMAN
                            - BLOCKED
                            - CANCELLING
                            - CANCELLED
                            - null
                        last_activity_at:
                          type:
                            - string
                            - "null"
                          format: date-time
                        attempts_with_current_notes:
                          type: integer
                          minimum: 0
                          description: Attempts (any mode) that received every current ticket note.
                      required:
                        - issue_key
                        - notes
                        - held
                        - status
                        - attempts
                        - dry_runs
                        - latest_job_id
                        - latest_state
                        - last_activity_at
                        - attempts_with_current_notes
                      examples:
                        - issue_key: SAMPLE-123
                          notes: []
                          held: true
                          status: held
                          attempts: 0
                          dry_runs: 0
                          latest_job_id: null
                          latest_state: null
                          last_activity_at: null
                          attempts_with_current_notes: 0
                required:
                  - tickets
              example:
                tickets: []
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  request_id:
                    type: string
                    format: uuid
                required:
                  - code
                  - message
                  - request_id
              example:
                code: NOT_FOUND
                message: Resource not found
                request_id: 00000000-0000-4000-8000-000000000002
        "401":
          description: Default Response
