  /v1/issues/{issueKey}/tier:
    get:
      operationId: getTierPins
      summary: List an issue's model-tier pins
      tags:
        - operator
      description: "A tier pin chooses a role's starting tier (a `model_tiers` name, optionally with an effort override) for an issue key. It can be stored before or after Autos has seen the issue, survives restarts and applies whenever a later attempt is picked up, until cleared. Precedence: a revision's own `tier` > this pin > the step that finished the previous attempt (revisions and retries) > triage > the first ladder tier; never below the role's floor (`min`). `effort` overrides the effort of every entry of the tier whose provider accepts one (Cursor entries run without one) and must be valid for each Claude/Codex entry. A tier in the role's ladder starts at its position (with an effort override it replaces that ladder step in place) and escalation continues to the next tier. A tier not in the ladder is a fixed step with no escalation, refused for a role with a floor; roles without a ladder can be pinned to any tier (fixed step). Returns an empty list when the issue has no pins."
      parameters:
        - schema:
            type: string
            pattern: ^[A-Z][A-Z0-9]*-[1-9][0-9]*$
          in: path
          name: issueKey
          required: true
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  pins:
                    type: array
                    maxItems: 3
                    items:
                      type: object
                      additionalProperties: false
                      description: "An operator model-tier pin: the starting tier of one role for every later attempt of the issue, until cleared."
                      properties:
                        issue_key:
                          type: string
                          pattern: ^[A-Z][A-Z0-9]*-[1-9][0-9]*$
