  /v1/issues/{issueKey}/notes:
    post:
      operationId: addTicketNote
      summary: Add a ticket note for an issue key
      tags:
        - operator
      description: "Notes are stored by issue key even before the issue is in the Jira filter or Autos has seen it, and are copied into every later attempt of that issue (discovered, submitted, retried or revised) until removed or the issue is closed. Each note targets roles (default swe). 400 for a project outside jira.allowed_projects or an invalid body/header, 409 when the issue is closed or already has the maximum number of notes. The text is evidence only: it never appears in events or logs. The optional `X-Autos-Operator` header labels the author; it is a label, not authentication. The response also reports a best-effort read-only Jira lookup (`jira`); a note for an issue not found in Jira is still stored."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                instructions:
                  type: string
                  minLength: 1
                  maxLength: 4000
                  description: Operator guidance for the selected roles. Cannot relax path policy or other platform rules.
                roles:
                  type: array
                  minItems: 1
                  maxItems: 3
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - swe
                      - qa
                      - reviewer
                  description: Roles that receive the note; defaults to ["swe"].
              required:
                - instructions
            example:
              instructions: Also handle the empty-list case.
              roles:
                - swe
                - qa
      parameters:
        - schema:
            type: string
            pattern: ^[A-Z][A-Z0-9]*-[1-9][0-9]*$
          in: path
          name: issueKey
          required: true
        - schema:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.@-]{0,63}$
          in: header
          name: x-autos-operator
          required: false
          description: Optional audit label (not authentication). Defaults to operator.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Operator guidance stored for an issue key; applied to every attempt of the issue until removed. The text is evidence only and never appears in events or logs.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                description: Operator guidance stored for an issue key; applied to every attempt of the issue until removed. The text is evidence only and never appears in events or logs.
                properties:
                  note_id:
                    type: string
                    format: uuid
                  issue_key:
                    type: string
                    pattern: ^[A-Z][A-Z0-9]*-[1-9][0-9]*$
                  instructions:
                    type: string
                    minLength: 1
                    maxLength: 4000
                  roles:
                    type: array
                    minItems: 1
                    maxItems: 3
                    items:
                      type: string
                      enum:
                        - swe
                        - qa
                        - reviewer
                  author:
                    type: string
                    pattern: ^[A-Za-z0-9][A-Za-z0-9_.@-]{0,63}$
                  created_at:
                    type: string
                    format: date-time
                  jira:
                    type: string
                    enum:
                      - found
                      - not_found
                      - unchecked
                    description: "Best-effort read-only Jira lookup: found, not_found (the note is kept; the issue may not exist yet or the key may be mistyped) or unchecked (no Jira read available or the lookup failed)."
                required:
                  - note_id
                  - issue_key
                  - instructions
                  - roles
                  - author
                  - created_at
                  - jira
              example:
                note_id: 00000000-0000-4000-8000-000000000010
                issue_key: SAMPLE-123
                instructions: Change only InvoiceService.java.
                roles:
                  - swe
                author: operator
                created_at: 2026-11-07T12:00:00.000Z
                jira: unchecked
