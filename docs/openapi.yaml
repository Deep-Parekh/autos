openapi: 3.1.0
info:
  title: Autos Controller API
  version: 0.1.0
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas: {}
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check controller health
      tags:
        - health
      security: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                required:
                  - status
              example:
                status: ok
  /v1/providers:
    get:
      operationId: listProviders
      summary: List provider diagnostics
      tags:
        - operator
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        provider:
                          type: string
                          enum:
                            - claude
                            - codex
                            - cursor
                        binary_present:
                          type: boolean
                        authenticated:
                          type:
                            - boolean
                            - "null"
                        read_only_smoke:
                          type: string
                          enum:
                            - PASS
                            - FAIL
                            - NOT_RUN
                        message:
                          type: string
                        model:
                          type: string
                          enum:
                            - auto
                          description: "Present for cursor only: Cursor always uses its automatic model selection."
                        roles:
                          type: array
                          description: Where this provider appears in a role chain (chain_index 0 = primary, 1..2 = fallbacks).
                          items:
                            type: object
                            additionalProperties: false
                            properties:
                              role:
                                type: string
                                enum:
                                  - swe
                                  - qa
                                  - reviewer
                              chain_index:
                                type: integer
                                minimum: 0
                                maximum: 2
                            required:
                              - role
                              - chain_index
                      required:
                        - provider
                        - binary_present
                        - authenticated
                        - read_only_smoke
                        - message
                        - roles
                required:
                  - providers
              example:
                providers:
                  - provider: claude
                    binary_present: true
                    authenticated: null
                    read_only_smoke: NOT_RUN
                    message: Host binary presence only; runner authentication has not been tested.
                    roles:
                      - role: swe
                        chain_index: 0
                      - role: qa
                        chain_index: 1
                  - provider: cursor
                    binary_present: true
                    authenticated: null
                    read_only_smoke: NOT_RUN
                    message: Host binary presence only; runner authentication has not been tested.
                    model: auto
                    roles:
                      - role: swe
                        chain_index: 2
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  request_id:
                    type: string
                    format: uuid
                required:
                  - code
                  - message
                  - request_id
              example:
                code: NOT_FOUND
                message: Resource not found
                request_id: 00000000-0000-4000-8000-000000000002
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  request_id:
                    type: string
                    format: uuid
                required:
                  - code
                  - message
                  - request_id
              example:
                code: NOT_FOUND
                message: Resource not found
                request_id: 00000000-0000-4000-8000-000000000002
        "403":
