                  tickets:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      description: An issue with ticket notes, a hold or tier pins, and whether Autos has worked on it.
                      properties:
                        issue_key:
                          type: string
                          pattern: ^[A-Z][A-Z0-9]*-[1-9][0-9]*$
                        notes:
                          type: array
                          maxItems: 5
                          items:
                            type: object
                            additionalProperties: false
                            description: Operator guidance stored for an issue key; applied to every attempt of the issue until removed. The text is evidence only and never appears in events or logs.
                            properties:
                              note_id:
                                type: string
                                format: uuid
                              issue_key:
                                type: string
                                pattern: ^[A-Z][A-Z0-9]*-[1-9][0-9]*$
                              instructions:
                                type: string
                                minLength: 1
                                maxLength: 4000
                              roles:
                                type: array
                                minItems: 1
                                maxItems: 3
                                items:
                                  type: string
                                  enum:
                                    - swe
                                    - qa
                                    - reviewer
                              author:
                                type: string
                                pattern: ^[A-Za-z0-9][A-Za-z0-9_.@-]{0,63}$
                              created_at:
                                type: string
                                format: date-time
                            required:
                              - note_id
                              - issue_key
                              - instructions
                              - roles
                              - author
                              - created_at
