  /v1/queue:
    get:
      operationId: listQueue
      summary: List queued and active jobs
      tags:
        - operator
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          in: query
          name: limit
          required: false
        - schema:
            type: string
            pattern: ^(0|[1-9][0-9]{0,5})$
          in: query
          name: cursor
          required: false
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  jobs:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      examples:
                        - job_id: 00000000-0000-4000-8000-000000000001
                          issue_key: SAMPLE-123
                          repository_id: null
                          base_sha: null
                          state: PLANNED
                          dry_run: true
                          repair_round: 0
                          created_at: 2026-11-07T12:00:00.000Z
                          updated_at: 2026-11-07T12:00:00.000Z
                      properties:
                        job_id:
                          type: string
                          format: uuid
                        issue_key:
                          type: string
                          pattern: ^[A-Z][A-Z0-9]*-[1-9][0-9]*$
                        repository_id:
                          type:
                            - string
                            - "null"
                        base_sha:
                          type:
                            - string
                            - "null"
                        base_branch:
                          type: string
                        state:
                          type: string
                          enum:
                            - QUEUED
                            - INVESTIGATING
                            - PLANNED
                            - IMPLEMENTING
                            - QA
                            - REVIEW
                            - REVISING
                            - READY_FOR_HUMAN
                            - BLOCKED
                            - CANCELLING
                            - CANCELLED
                        dry_run:
                          type: boolean
                        repair_round:
                          type: integer
                          minimum: 0
                          maximum: 2
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                        blocked_code:
                          type: string
                          enum:
                            - INVALID_CONFIG
                            - INVALID_INPUT
                            - AUTH
                            - FORBIDDEN
                            - NOT_FOUND
                            - RATE_LIMIT
                            - UPSTREAM
                            - MAPPING
                            - BRANCH_COLLISION
                            - POLICY
                            - TIMEOUT
                            - CANCELLED
                            - CONTEXT
                            - TOOL
                            - INVALID_OUTPUT
                            - STALE_CANDIDATE
                            - CHECK_FAILED
                            - CONFLICT
                            - INTERNAL
                            - UNAVAILABLE
                        blocked_reason:
                          type: string
                        feature_branch:
                          type: string
                        commit_sha:
                          type: string
                        push_status:
                          type: string
                          enum:
                            - DISABLED
                            - NOT_ATTEMPTED
                            - PUSHED
                            - FAILED
                        parent_job_id:
                          type: string
                          format: uuid
                          description: "Set on revision jobs: the READY_FOR_HUMAN job whose commit this attempt continues."
                        revision:
                          type: integer
                          minimum: 0
                          maximum: 20
                          description: 0 for an initial attempt, n for the n-th requested revision of the same issue.
                        closed_as:
                          type: string
                          enum:
                            - MERGED
                            - ABANDONED
                          description: Set on every attempt of an issue the operator closed (MERGED or ABANDONED).
                      required:
                        - job_id
                        - issue_key
                        - repository_id
                        - base_sha
                        - state
                        - dry_run
                        - repair_round
                        - created_at
                        - updated_at
                  next_cursor:
                    type:
                      - string
                      - "null"
                required:
                  - jobs
                  - next_cursor
              example:
                jobs: []
                next_cursor: null
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
