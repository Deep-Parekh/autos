  /v1/events/stream:
    get:
      operationId: streamEvents
      summary: Stream progress events as Server-Sent Events
      tags:
        - operator
      description: Replays persisted events after `after` (or the Last-Event-ID header), then streams live events. Each message has `id` (event_id), `event` (type) and JSON `data`; a comment heartbeat is sent every 15 seconds.
      parameters:
        - schema:
            type: integer
            minimum: 0
          in: query
          name: after
          required: false
        - schema:
            type: string
            format: uuid
          in: query
          name: job_id
          required: false
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string
                examples:
                  - |+
                    id: 12
                    event: role_started
