  /v1/status:
    get:
      operationId: getStatus
      summary: Get live controller, runner, and workflow activity status
      tags:
        - operator
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  controller:
                    type: object
                    additionalProperties: false
                    properties:
                      version:
                        type: string
                      started_at:
                        type: string
                        format: date-time
                      uptime_s:
                        type: integer
                        minimum: 0
                      poll_interval_s:
                        type: integer
                        minimum: 1
                      poll_loop:
                        type: object
                        additionalProperties: false
                        properties:
                          running:
                            type: boolean
                          next_poll_at:
                            type:
                              - string
                              - "null"
                            format: date-time
                          consecutive_failures:
                            type: integer
                            minimum: 0
                          auto_poll:
                            type: boolean
                            description: jira.auto_poll; when false the controller never reads the Jira filter and only runs submitted jobs.
                          last_discovery_at:
                            type:
                              - string
                              - "null"
                            format: date-time
                            description: Completion time of the last successful Jira discovery.
                        required:
                          - running
                          - next_poll_at
                          - consecutive_failures
                          - auto_poll
