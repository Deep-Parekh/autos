  /v1/workspaces:
    get:
      operationId: listWorkspaces
      summary: List workspace directories with their retention decision
      tags:
        - operator
      description: Lists workspace directories on the host (basenames only, never paths) with the state of the owning job and why each is kept or removable. `sizes=true` walks the trees to report sizes and can be slow. Also returns the configured retention policy.
      parameters:
        - schema:
            type: boolean
            default: false
          in: query
          name: sizes
          required: false
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  workspaces:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      description: One workspace directory (basename only, never a path) with its retention decision.
                      properties:
                        name:
                          type: string
                          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                        job_id:
                          type: string
                          format: uuid
                        issue_key:
                          type:
                            - string
                            - "null"
                          description: Null for an orphan directory with no matching job.
                        state:
                          type:
                            - string
                            - "null"
                          enum:
                            - QUEUED
                            - INVESTIGATING
                            - PLANNED
                            - IMPLEMENTING
                            - QA
                            - REVIEW
                            - REVISING
                            - READY_FOR_HUMAN
                            - BLOCKED
