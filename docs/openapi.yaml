                          description: A tier name from model_tiers.
                        effort:
                          type:
                            - string
                            - "null"
                          enum:
                            - none
                            - minimal
                            - low
                            - medium
                            - high
                            - xhigh
                            - max
                            - null
                          description: "Effort override for every entry of the tier whose provider accepts one; null: each entry keeps its configured effort."
                        author:
                          type: string
                          pattern: ^[A-Za-z0-9][A-Za-z0-9_.@-]{0,63}$
                        created_at:
                          type: string
                          format: date-time
                      required:
                        - issue_key
                        - role
                        - tier
                        - effort
                        - author
                        - created_at
                      examples:
                        - issue_key: SAMPLE-123
                          role: swe
                          tier: med
                          effort: xhigh
                          author: operator
                          created_at: 2026-11-07T12:00:00.000Z
                required:
                  - pins
              example:
                pins: []
        "400":
          description: Default Response
          content:
