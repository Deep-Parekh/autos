  /v1/index/sync:
    post:
      operationId: syncIndex
      summary: Start a precedent index sync
      tags:
        - operator
      description: "Incremental Jira sync (`full`: re-read the whole window; `reconcile`: also purge issues that were deleted, moved or became restricted), mirror scan and lineage recompute. Read-only towards Jira and Bitbucket. Runs in the background (one index operation at a time, shared with the background loop); follow it with GET /v1/index/status. 409 when another index operation is running or precedents.enabled is false. 404 (`NOT_FOUND`) when the precedent index is not configured."
