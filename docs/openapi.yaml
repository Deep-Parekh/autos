  /v1/jobs/retry-blocked:
    post:
      operationId: retryBlockedJobs
      summary: Retry blocked jobs in bulk
      tags:
        - operator
      description: Starts a new attempt (workflow retry) for every BLOCKED job, optionally only those with one `blocked_code`. A job is skipped when its issue already has a newer attempt, so only the newest blocked attempt per issue is retried. New attempts are queued; the controller runs them as slots free up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                code:
                  type: string
                  enum:
                    - INVALID_CONFIG
                    - INVALID_INPUT
                    - AUTH
                    - FORBIDDEN
                    - NOT_FOUND
                    - RATE_LIMIT
                    - UPSTREAM
                    - MAPPING
                    - BRANCH_COLLISION
                    - POLICY
                    - TIMEOUT
                    - CANCELLED
                    - CONTEXT
                    - TOOL
                    - INVALID_OUTPUT
                    - STALE_CANDIDATE
                    - CHECK_FAILED
                    - CONFLICT
                    - INTERNAL
                    - UNAVAILABLE
                  description: Only retry jobs blocked with this code.
            example:
              code: UPSTREAM
      parameters:
        - schema:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.@-]{0,63}$
          in: header
          name: x-autos-operator
          required: false
          description: Optional audit label (not authentication). Defaults to operator.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  matched:
                    type: integer
                    minimum: 0
                    description: Blocked jobs that matched the filter.
                  retried:
                    type: integer
                    minimum: 0
                  skipped_newer_attempt:
                    type: integer
                    minimum: 0
                  failed:
                    type: integer
                    minimum: 0
                  jobs:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        issue_key:
                          type: string
                        job_id:
                          type: string
                          format: uuid
                        new_job_id:
                          type: string
                          format: uuid
