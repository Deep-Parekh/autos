  /v1/confluence-drafts:
    post:
      operationId: createConfluenceDraft
      summary: Create a Confluence fix-document draft
      tags:
        - operator
      description: "Creates (or refreshes while it is still an untouched draft) the Confluence fix-document draft of a READY_FOR_HUMAN attempt: `job_id`, or `issue_key` for the issue's latest READY_FOR_HUMAN attempt. The draft is unpublished and visible only to the Atlassian account whose token the controller uses; a person must review and publish it in Confluence. Autos never publishes, updates a published page or deletes anything. 404 (`NOT_FOUND`) when drafts are not configured (confluence.drafts.enabled) or the job/issue is unknown; 409 when the attempt is not READY_FOR_HUMAN."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                job_id:
                  type: string
                  format: uuid
                issue_key:
                  type: string
                  pattern: ^[A-Z][A-Z0-9]*-[1-9][0-9]*$
            example:
              issue_key: SAMPLE-123
      parameters:
        - schema:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.@-]{0,63}$
          in: header
          name: x-autos-operator
          required: false
          description: Optional audit label (not authentication). Defaults to operator.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  schema_version:
                    type: integer
                    enum:
                      - 1
                  job_id:
                    type: string
                  issue_key:
                    type: string
                    pattern: ^[A-Z][A-Z0-9]*-[1-9][0-9]*$
                  draft:
                    type: object
                    additionalProperties: false
                    properties:
                      page_id:
                        type: string
                        pattern: ^[0-9]+$
                      space_id:
                        type: string
                        pattern: ^[0-9]+$
                      version:
                        type: integer
                        minimum: 1
                      status:
                        type: string
                        enum:
                          - draft
                      edit_url:
                        type: string
                        format: uri
                    required:
                      - page_id
                      - space_id
                      - version
                      - status
                      - edit_url
                  created_at:
                    type: string
                    format: date-time
                  supersedes_page_id:
                    type:
                      - string
                      - "null"
                    pattern: ^[0-9]+$
                required:
                  - schema_version
                  - job_id
                  - issue_key
                  - draft
                  - created_at
                  - supersedes_page_id
              example:
                schema_version: 1
                job_id: 00000000-0000-4000-8000-000000000001
                issue_key: SAMPLE-123
                draft:
                  page_id: "123456"
                  space_id: "98765"
                  version: 1
                  status: draft
                  edit_url: https://example.atlassian.net/wiki/pages/resumedraft.action?draftId=123456
                created_at: 2026-11-12T12:00:00.000Z
                supersedes_page_id: null
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  request_id:
                    type: string
                    format: uuid
                required:
                  - code
                  - message
                  - request_id
              example:
                code: NOT_FOUND
                message: Resource not found
                request_id: 00000000-0000-4000-8000-000000000002
        "401":
          description: Default Response
          content:
