  /v1/issues/{issueKey}/close:
    post:
      operationId: closeIssue
      summary: Close an issue after manual review (MERGED or ABANDONED)
      tags:
        - operator
      description: "Irreversible. Records the operator's resolution, removes ALL of the issue's workspaces from disk and keeps artifacts (evidence). Afterwards the issue accepts no new attempt, revision or retry. Autos does not verify that anything was merged: the resolution is an operator assertion, and Jira and Bitbucket are not modified. Refused with 409 while an attempt of the issue is active, or when MERGED is asserted without a non-dry-run READY_FOR_HUMAN attempt; closing again with the same resolution only retries workspace removal. Use `dry_run` to see what would be removed. The optional note is stored in evidence only and never returned, logged or put in events. The optional `X-Autos-Operator` header labels the closer; it is a label, not authentication."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                resolution:
                  type: string
                  enum:
                    - MERGED
                    - ABANDONED
                  description: "MERGED: the operator merged the latest READY_FOR_HUMAN commit. ABANDONED: the work will not be used."
                note:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: Optional operator note kept in evidence (closure.json); never returned, logged or put in events.
                dry_run:
                  type: boolean
                  default: false
                  description: Report what would be removed without changing anything.
              required:
                - resolution
            example:
              resolution: MERGED
              dry_run: true
      parameters:
        - schema:
            type: string
            pattern: ^[A-Z][A-Z0-9]*-[1-9][0-9]*$
          in: path
          name: issueKey
          required: true
        - schema:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9_.@-]{0,63}$
          in: header
          name: x-autos-operator
          required: false
          description: Optional audit label (not authentication). Defaults to operator.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  dry_run:
                    type: boolean
                  closure:
                    type: object
                    additionalProperties: false
                    properties:
                      issue_key:
                        type: string
                        pattern: ^[A-Z][A-Z0-9]*-[1-9][0-9]*$
                      resolution:
                        type: string
                        enum:
                          - MERGED
                          - ABANDONED
                      closed_at:
                        type: string
                        format: date-time
                      closed_by:
                        type: string
                        pattern: ^[A-Za-z0-9][A-Za-z0-9_.@-]{0,63}$
                      job_id:
                        type:
                          - string
                          - "null"
                        format: uuid
                        description: Latest non-dry-run READY_FOR_HUMAN attempt at close time, else null.
                      commit_sha:
                        type:
                          - string
                          - "null"
                      feature_branch:
                        type:
                          - string
                          - "null"
                    required:
                      - issue_key
                      - resolution
                      - closed_at
                      - closed_by
                      - job_id
                      - commit_sha
                      - feature_branch
                  removed:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      description: One workspace directory (basename only, never a path) with its retention decision.
                      properties:
                        name:
                          type: string
                          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                        job_id:
                          type: string
                          format: uuid
                        issue_key:
                          type:
                            - string
                            - "null"
                          description: Null for an orphan directory with no matching job.
                        state:
                          type:
                            - string
                            - "null"
                          enum:
                            - QUEUED
                            - INVESTIGATING
                            - PLANNED
                            - IMPLEMENTING
                            - QA
                            - REVIEW
                            - REVISING
                            - READY_FOR_HUMAN
                            - BLOCKED
                            - CANCELLING
                            - CANCELLED
                            - null
                        closed_as:
                          type:
                            - string
                            - "null"
                          enum:
                            - MERGED
                            - ABANDONED
                            - null
                        modified_at:
                          type: string
                          format: date-time
                        size_bytes:
                          type:
                            - integer
                            - "null"
                          minimum: 0
                          description: Only when sizes were requested, else null.
                        removable:
                          type:
                            - string
                            - "null"
                          enum:
                            - closed
                            - superseded
                            - retention
                            - orphan
                            - null
                          description: Why the workspace is removable now; null when retained.
                        retained_because:
                          type:
                            - string
                            - "null"
                          enum:
                            - active
                            - awaiting_review
                            - within_retention
                            - null
                      required:
                        - name
                        - job_id
                        - issue_key
                        - state
                        - closed_as
                        - modified_at
                        - size_bytes
                        - removable
                        - retained_because
                  failed:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        name:
                          type: string
                          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                        job_id:
                          type: string
                          format: uuid
                        code:
                          type: string
                          enum:
                            - INVALID_CONFIG
                            - INVALID_INPUT
                            - AUTH
                            - FORBIDDEN
                            - NOT_FOUND
                            - RATE_LIMIT
                            - UPSTREAM
                            - MAPPING
                            - BRANCH_COLLISION
                            - POLICY
                            - TIMEOUT
                            - CANCELLED
                            - CONTEXT
                            - TOOL
                            - INVALID_OUTPUT
                            - STALE_CANDIDATE
                            - CHECK_FAILED
                            - CONFLICT
                            - INTERNAL
                            - UNAVAILABLE
                      required:
                        - name
                        - job_id
                        - code
                required:
                  - dry_run
                  - closure
                  - removed
                  - failed
              example:
                dry_run: true
                closure:
                  issue_key: SAMPLE-123
                  resolution: MERGED
                  closed_at: 2026-11-07T12:00:00.000Z
                  closed_by: operator
                  job_id: 00000000-0000-4000-8000-000000000001
                  commit_sha: null
